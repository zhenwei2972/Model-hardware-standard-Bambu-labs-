# Copy to ./config.toml (git-ignored) or ~/.config/mhs/config.toml

[server]
default_printer = "a1mini"
# Monitoring only: every write tool refuses. Good for a first run.
read_only = false
# Lift the gcode safe-list. Leave false unless you know what you are sending.
allow_raw_gcode = false
# Where the job queue, print journal and captured frames live.
# state_dir = "~/.local/share/mhs"

# Slicing. Leave the whole section out to search the PATH for OrcaSlicer,
# Bambu Studio or PrusaSlicer; without one, only the slicing tools are missing.
# [slicer]
# binary = "/Applications/OrcaSlicer.app/Contents/MacOS/OrcaSlicer"
# profiles = ["~/.config/OrcaSlicer/user/default/A1 mini 0.4 nozzle.json"]

# Watching a print through its stages (first layer, quarter, half, ...).
[monitor]
poll_seconds = 20             # a print is slow; polling faster only costs the MCU

[printers.a1mini]
driver = "bambu"
model = "A1 mini"              # also sets the reported build volume
host = "192.168.1.42"          # printer screen -> Settings -> WLAN
serial = "0309CA1234567890"    # rear sticker or Settings > Device; the TLS cert name
access_code = "12345678"       # 8 chars, shown once LAN Only Mode is on
upload_dir = "cache"           # where uploads land on the printer
tls_mode = "verify"            # verify | ca_only | insecure

# A second printer is just another table; every tool takes printer="p1s".
# [printers.p1s]
# driver = "bambu"
# model = "P1S"
# host = "192.168.1.43"
# serial = "01S00A000000000"
# access_code = "87654321"

# No hardware? This one needs nothing else.
# [printers.demo]
# driver = "mock"
# model = "Mock A1 mini"

# A Roborock vacuum. Run `mhs roborock-login` once first: it exchanges your
# password for a token and stores only the token, mode 600. Needs the extra:
#   pip install -e ".[roborock]"
# [devices.saros]
# driver = "roborock"
# model = "Saros 10"              # Saros 10 | Saros 10R | Saros Z70
# email = "you@example.com"
# device_name = "Saros 10"        # only if the account has several robots
# credentials_file = "~/.local/share/mhs/roborock-credentials.json"

# No robot? This one needs nothing else.
# [devices.demo-vacuum]
# driver = "mock_vacuum"
# model = "Saros 10"
