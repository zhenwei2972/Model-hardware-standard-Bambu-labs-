[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mhs-printer"
version = "0.1.0"
description = "An MHS-aligned MCP server and driver layer that lets Claude drive, measure and design for 3D printers (Bambu Lab A1 mini and friends)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "zhenwei2972" }]
keywords = ["mcp", "mhs", "model-hardware-standard", "3d-printing", "bambu-lab", "a1-mini", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Printing",
]
dependencies = [
  "mcp>=2.0",
  "paho-mqtt>=2.1",
  "numpy>=1.24",   # mesh geometry and the software rasteriser
  "pillow>=10.0",  # camera frames, grid overlays, render output
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
mhs = "mhs.cli:main"
mhs-mcp = "mhs.server:main"

[project.urls]
Homepage = "https://github.com/zhenwei2972/model-hardware-standard-bambu-labs-"

[tool.hatch.build.targets.wheel]
packages = ["src/mhs"]

[tool.hatch.build.targets.wheel.force-include]
"src/mhs/drivers/bambu/bambu_ca.pem" = "mhs/drivers/bambu/bambu_ca.pem"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:mhs.*"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
