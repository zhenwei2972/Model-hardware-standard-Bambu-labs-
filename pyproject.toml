[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mhs-printer"
version = "0.1.0"
description = "An MHS-aligned MCP server and driver layer that lets Claude operate physical devices: Bambu Lab 3D printers and Roborock robot vacuums"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "zhenwei2972" }]
keywords = [
  "mcp", "mcp-server", "model-context-protocol", "mhs",
  "model-hardware-standard", "claude",
  "3d-printing", "3d-printer", "bambu-lab", "a1-mini", "slicer",
  "roborock", "saros", "robot-vacuum", "home-automation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Printing",
]
dependencies = [
  "mcp>=2.0",
  "paho-mqtt>=2.1",
  "numpy>=1.24",   # mesh geometry and the software rasteriser
  "pillow>=10.0",  # camera frames, grid overlays, render output
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# The Roborock protocol (four wire versions, AES-ECB/CBC/GCM, a compressed map
# format) is implemented by python-roborock rather than here; it is an extra so
# a printer-only install does not pull aiohttp, protobuf and pyshark.
roborock = ["python-roborock>=7.8", "vacuum-map-parser-roborock>=0.1.2"]
dev = [
  "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6",
  "python-roborock>=7.8", "aioresponses>=0.7",
]

[project.scripts]
mhs = "mhs.cli:main"
mhs-mcp = "mhs.server:main"

[project.urls]
Homepage = "https://github.com/zhenwei2972/model-hardware-standard-bambu-labs-"

[tool.hatch.build.targets.wheel]
packages = ["src/mhs"]

[tool.hatch.build.targets.wheel.force-include]
"src/mhs/drivers/bambu/bambu_ca.pem" = "mhs/drivers/bambu/bambu_ca.pem"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:mhs.*"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
